compressionLevel: mixed

enableGlobalCache: false

nodeLinker: node-modules

# Keep deps in each workspace's own node_modules, as the monorepo root does.
nmHoistingLimits: workspaces

# yarn install fails if it would modify yarn.lock: an upgrade is intentional.
enableImmutableInstalls: true

# Supply-chain protection: block packages younger than 7 days from yarn add.
npmMinimalAgeGate: 10080
